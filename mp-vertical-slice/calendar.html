<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Meal Plan | Meal Planner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --accent: #D4552A;
            --accent-hover: #BC4720;
            --accent-soft: #FCDCCD;
            --pantry-green: #4C7A3A;
            --text: #1F2328;
            --text-muted: #5B6068;
            --page-bg: #E9EDF3;
            --nav-bg: #F7F4F1;
            --surface: #FFFFFF;
            --glass: rgba(255, 255, 255, 0.74);
            --glass-border: rgba(255, 255, 255, 0.65);
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: var(--page-bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            color: inherit;
        }

        .icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .app {
            display: grid;
            grid-template-rows: 90px minmax(0, 1fr) auto;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--nav-bg);
        }

        .page-header {
            position: relative;
            display: grid;
            place-items: center;
            padding: calc(12px + env(safe-area-inset-top)) 20px 0;
            border-bottom: 1px solid rgba(31, 35, 40, 0.1);
        }

        .page-header h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .gear-btn {
            position: absolute;
            top: 50%;
            right: 24px;
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            padding: 0;
            transform: translateY(-50%);
            border: 0;
            border-radius: 50%;
            background-color: var(--surface);
            cursor: pointer;
        }

        .gear-btn:focus-visible,
        .week-arrow:focus-visible,
        .day-button:focus-visible,
        .add-btn:focus-visible,
        .find-recipe:focus-visible,
        .nav-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .content {
            overflow: auto;
            padding: 18px 21px 30px;
        }

        .calendar-content {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .week-switcher {
            display: grid;
            grid-template-columns: 52px 1fr 52px;
            align-items: center;
            gap: 12px;
        }

        .week-arrow {
            display: grid;
            place-items: center;
            width: 52px;
            height: 58px;
            padding: 0;
            border: 1px solid #D0D8E2;
            border-radius: 24px;
            background-color: var(--surface);
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .week-arrow:hover {
            background-color: #F1EEEB;
        }

        .week-arrow:active,
        .add-btn:active {
            transform: scale(0.96);
        }

        .week-label {
            text-align: center;
        }

        .week-label h2 {
            margin: 0;
            font-size: 1.08rem;
            font-weight: 600;
        }

        .week-label p {
            margin: 2px 0 0;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .week-days {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
            margin-top: 22px;
        }

        .day-button {
            display: flex;
            position: relative;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 0;
            height: 81px;
            padding: 6px 2px 10px;
            border: 1px solid #D0D8E2;
            border-radius: 22px;
            background-color: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .day-button:hover {
            background-color: #F1EEEB;
        }

        .day-button[aria-pressed="true"] {
            border-color: var(--accent);
            background-color: var(--accent);
            color: white;
        }

        .day-name {
            font-size: 0.62rem;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
        }

        .day-number {
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1;
        }

        .day-dot {
            position: absolute;
            bottom: 9px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--accent);
        }

        .day-button[aria-pressed="true"] .day-dot {
            background-color: white;
        }

        .selected-day {
            margin-top: 31px;
        }

        .selected-date {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .selected-heading-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .selected-heading-row h2 {
            margin: 0;
            font-size: clamp(1.7rem, 6vw, 2rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .add-btn {
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            flex: 0 0 50px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 50%;
            background-color: var(--accent);
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .add-btn:hover {
            background-color: var(--accent-hover);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 183px;
            margin-top: 28px;
            border: 1px dashed #D0D8E2;
            border-radius: 24px;
            text-align: center;
        }

        .empty-state p {
            margin: 0 0 8px;
            font-size: 1rem;
            font-weight: 600;
        }

        .find-recipe {
            padding: 0;
            border: 0;
            background: none;
            color: var(--accent);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .find-recipe:hover {
            color: var(--accent-hover);
        }

        .nav {
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
            background-color: var(--nav-bg);
        }

        .nav-brand {
            display: none;
        }

        .nav ul {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            max-width: 620px;
            margin: 0 auto;
            padding: 10px 6px;
            list-style: none;
            border-radius: 26px;
            background-color: var(--surface);
            box-shadow: 0 4px 18px rgba(31, 35, 40, 0.06);
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 2px 0;
            border-radius: 14px;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--text);
        }

        .nav-icon {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            transition: background-color 0.2s ease;
        }

        .nav-link[aria-current="page"] {
            color: var(--accent);
        }

        .nav-link[aria-current="page"] .nav-icon {
            background-color: var(--accent-soft);
        }

        @media (min-width: 640px) {
            .content {
                padding: 28px 32px 40px;
            }

            .week-days {
                gap: 8px;
                margin-top: 26px;
            }

            .day-button {
                height: 86px;
            }

            .day-name {
                font-size: 0.72rem;
            }

            .selected-day {
                margin-top: 38px;
            }

            .empty-state {
                min-height: 210px;
            }
        }

        @media (min-width: 1024px) {
            .app {
                grid-template-columns: 240px minmax(0, 1fr);
                grid-template-rows: 90px minmax(0, 1fr);
            }

            .page-header,
            .content {
                grid-column: 2;
            }

            .page-header {
                grid-row: 1;
            }

            .content {
                grid-row: 2;
                padding: 32px 40px 48px;
            }

            .nav {
                grid-column: 1;
                grid-row: 1 / 3;
                display: flex;
                flex-direction: column;
                gap: 28px;
                padding: 30px 16px;
            }

            .nav-brand {
                display: block;
                margin: 0;
                padding: 0 12px;
                font-size: 1.4rem;
                font-weight: 700;
                letter-spacing: -0.01em;
            }

            .nav-brand span {
                color: var(--accent);
            }

            .nav ul {
                display: flex;
                flex-direction: column;
                gap: 4px;
                max-width: none;
                margin: 0;
                padding: 0;
                background: none;
                box-shadow: none;
            }

            .nav .nav-home {
                order: -1;
            }

            .nav-link {
                flex-direction: row;
                gap: 12px;
                padding: 4px 8px;
                font-size: 0.97rem;
                font-weight: 500;
                transition: color 0.2s ease, background-color 0.2s ease;
            }

            .nav-link:hover {
                background-color: rgba(31, 35, 40, 0.05);
            }

            .nav-link[aria-current="page"] {
                background-color: var(--surface);
                box-shadow: 0 4px 14px rgba(31, 35, 40, 0.06);
            }

            .selected-day {
                margin-top: 42px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <symbol id="icon-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
        <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
        <symbol id="icon-calendar" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></symbol>
        <symbol id="icon-list" viewBox="0 0 24 24"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></symbol>
        <symbol id="icon-home" viewBox="0 0 24 24"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
        <symbol id="icon-basket" viewBox="0 0 24 24"><path d="m15 11-1 9"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="M4.5 15.5h15"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/></symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></symbol>
    </svg>

    <div class="app">
        <header class="page-header">
            <h1>Meal plan</h1>
            <button type="button" class="gear-btn" aria-label="Settings">
                <svg class="icon"><use href="#icon-settings"/></svg>
            </button>
        </header>

        <main class="content">
            <div class="calendar-content">
                <section class="week-switcher" aria-label="Choose week">
                    <button type="button" class="week-arrow" id="previous-week" aria-label="Previous week">
                        <svg class="icon"><use href="#icon-chevron-left"/></svg>
                    </button>
                    <div class="week-label" aria-live="polite">
                        <h2 id="week-range"></h2>
                        <p id="week-relative"></p>
                    </div>
                    <button type="button" class="week-arrow" id="next-week" aria-label="Next week">
                        <svg class="icon"><use href="#icon-chevron-right"/></svg>
                    </button>
                </section>

                <section class="week-days" id="week-days" aria-label="Days of the week"></section>

                <section class="selected-day" aria-labelledby="selected-heading">
                    <p class="selected-date" id="selected-date"></p>
                    <div class="selected-heading-row">
                        <h2 id="selected-heading">What's cooking</h2>
                        <button type="button" class="add-btn" aria-label="Add a meal">
                            <svg class="icon"><use href="#icon-plus"/></svg>
                        </button>
                    </div>
                    <div class="empty-state">
                        <p>Nothing planned yet</p>
                        <button type="button" class="find-recipe">Find a recipe</button>
                    </div>
                </section>
            </div>
        </main>

        <nav class="nav" aria-label="Main">
            <p class="nav-brand">Meal Planner<span>.</span></p>
            <ul>
                <li><a class="nav-link" href="calendar.html" aria-current="page"><span class="nav-icon"><svg class="icon"><use href="#icon-calendar"/></svg></span>Calendar</a></li>
                <li><a class="nav-link" href="shopping.html"><span class="nav-icon"><svg class="icon"><use href="#icon-list"/></svg></span>Shopping</a></li>
                <li class="nav-home"><a class="nav-link" href="index.html"><span class="nav-icon"><svg class="icon"><use href="#icon-home"/></svg></span>Home</a></li>
                <li><a class="nav-link" href="search.html"><span class="nav-icon"><svg class="icon"><use href="#icon-search"/></svg></span>Search</a></li>
                <li><a class="nav-link" href="pantry.html"><span class="nav-icon"><svg class="icon"><use href="#icon-basket"/></svg></span>Pantry</a></li>
            </ul>
        </nav>
    </div>

    <script>
        const selectedDate = new Date();
        const weekDays = document.getElementById("week-days");
        const weekRange = document.getElementById("week-range");
        const weekRelative = document.getElementById("week-relative");
        const selectedDateLabel = document.getElementById("selected-date");
        const dateFormatter = new Intl.DateTimeFormat("en-US", { month: "long", day: "numeric" });

        function getLocalDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function renderCalendar() {
            const sunday = new Date(selectedDate);
            sunday.setDate(sunday.getDate() - sunday.getDay());
            const saturday = new Date(sunday);
            saturday.setDate(saturday.getDate() + 6);

            const sameMonth = sunday.getMonth() === saturday.getMonth();
            weekRange.textContent = sameMonth
                ? `${new Intl.DateTimeFormat("en-US", { month: "long" }).format(sunday)} ${sunday.getDate()}–${saturday.getDate()}`
                : `${dateFormatter.format(sunday)}–${dateFormatter.format(saturday)}`;
            const today = new Date();
            const currentSunday = new Date(today);
            currentSunday.setDate(currentSunday.getDate() - currentSunday.getDay());
            currentSunday.setHours(0, 0, 0, 0);
            const weekOffset = Math.round((sunday - currentSunday) / (7 * 24 * 60 * 60 * 1000));
            weekRelative.textContent = weekOffset === 0
                ? "This week"
                : weekOffset === 1
                    ? "Next week"
                    : weekOffset === -1
                        ? "Last week"
                        : `Week of ${dateFormatter.format(sunday)}`;

            weekDays.replaceChildren();
            for (let index = 0; index < 7; index += 1) {
                const date = new Date(sunday);
                date.setDate(sunday.getDate() + index);
                const button = document.createElement("button");
                button.type = "button";
                button.className = "day-button";
                button.setAttribute("aria-pressed", getLocalDateKey(date) === getLocalDateKey(selectedDate) ? "true" : "false");
                button.setAttribute("aria-label", new Intl.DateTimeFormat("en-US", {
                    weekday: "long",
                    month: "long",
                    day: "numeric"
                }).format(date));

                const dayName = document.createElement("span");
                dayName.className = "day-name";
                dayName.textContent = new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(date);
                const dayNumber = document.createElement("span");
                dayNumber.className = "day-number";
                dayNumber.textContent = String(date.getDate());
                button.append(dayName, dayNumber);
                button.addEventListener("click", () => {
                    selectedDate.setTime(date.getTime());
                    renderCalendar();
                });
                weekDays.append(button);
            }

            selectedDateLabel.textContent = new Intl.DateTimeFormat("en-US", {
                weekday: "short",
                month: "long",
                day: "numeric"
            }).format(selectedDate).toUpperCase();
        }

        document.getElementById("previous-week").addEventListener("click", () => {
            selectedDate.setDate(selectedDate.getDate() - 7);
            renderCalendar();
        });
        document.getElementById("next-week").addEventListener("click", () => {
            selectedDate.setDate(selectedDate.getDate() + 7);
            renderCalendar();
        });

        renderCalendar();
    </script>
</body>
</html>
