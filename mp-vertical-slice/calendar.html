<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Meal Plan | Meal Planner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        :root {
            --accent: #D4552A;
            --accent-hover: #BC4720;
            --accent-soft: #FCDCCD;
            --pantry-green: #4C7A3A;
            --text: #1F2328;
            --text-muted: #5B6068;
            --page-bg: #E9EDF3;
            --nav-bg: #F7F4F1;
            --surface: #FFFFFF;
            --glass: rgba(255, 255, 255, 0.74);
            --glass-border: rgba(255, 255, 255, 0.65);
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background-color: var(--page-bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            color: inherit;
        }

        .icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .app {
            display: grid;
            grid-template-rows: 90px minmax(0, 1fr) auto;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--nav-bg);
        }

        .page-header {
            position: relative;
            display: grid;
            place-items: center;
            padding: calc(12px + env(safe-area-inset-top)) 20px 0;
            border-bottom: 1px solid rgba(31, 35, 40, 0.1);
        }

        .page-header h1 {
            margin: 0;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .gear-btn {
            position: absolute;
            top: 50%;
            right: 24px;
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            padding: 0;
            transform: translateY(-50%);
            border: 0;
            border-radius: 50%;
            background-color: var(--surface);
            cursor: pointer;
        }

        .gear-btn:focus-visible,
        .week-arrow:focus-visible,
        .day-button:focus-visible,
        .add-btn:focus-visible,
        .find-recipe:focus-visible,
        .nav-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .content {
            overflow: auto;
            padding: 18px 21px 30px;
        }

        .calendar-content {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }

        .week-switcher {
            display: grid;
            grid-template-columns: 52px 1fr 52px;
            align-items: center;
            gap: 12px;
        }

        .week-arrow {
            display: grid;
            place-items: center;
            width: 52px;
            height: 58px;
            padding: 0;
            border: 1px solid #D0D8E2;
            border-radius: 24px;
            background-color: var(--surface);
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .week-arrow:hover {
            background-color: #F1EEEB;
        }

        .week-arrow:active,
        .add-btn:active {
            transform: scale(0.96);
        }

        .week-label {
            text-align: center;
        }

        .week-label h2 {
            margin: 0;
            font-size: 1.08rem;
            font-weight: 600;
        }

        .week-label p {
            margin: 2px 0 0;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        /* The week range opens the month view */
        .month-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border: 0;
            border-radius: 14px;
            background: none;
            font: inherit;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .month-toggle:hover {
            background-color: #F1EEEB;
        }

        .month-toggle .icon {
            width: 18px;
            height: 18px;
            color: var(--accent);
        }

        /* ---------- Popups (month view, remove confirmation) ----------
           Phones: a sheet from the bottom. Wider screens: a centered card. */
        .month-picker,
        .confirm-dialog {
            width: min(420px, calc(100% - 48px));
            max-width: none;
            padding: 0;
            border: none;
            border-radius: 28px;
            color: var(--text);
            background-color: #FAF8F5;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
        }

        .month-picker::backdrop,
        .confirm-dialog::backdrop {
            background-color: rgba(20, 16, 14, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .confirm-dialog {
            width: min(380px, calc(100% - 48px));
        }

        .confirm-dialog form {
            padding: 24px 24px calc(24px + env(safe-area-inset-bottom));
            text-align: center;
        }

        .confirm-icon {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background-color: var(--accent-soft);
            color: var(--accent);
        }

        .confirm-dialog h2 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .confirm-dialog p {
            margin: 8px 0 0;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .confirm-dialog strong {
            color: var(--text);
            font-weight: 600;
        }

        .confirm-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 22px;
        }

        .confirm-actions button {
            padding: 12px 18px;
            border: 1px solid #D0D8E2;
            border-radius: 16px;
            background-color: var(--surface);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .confirm-actions button:hover {
            background-color: #F1EEEB;
        }

        .confirm-actions .confirm-danger {
            border-color: var(--accent);
            background-color: var(--accent);
            color: white;
        }

        .confirm-actions .confirm-danger:hover {
            border-color: var(--accent-hover);
            background-color: var(--accent-hover);
        }

        .confirm-actions button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .month-picker-body {
            padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
        }

        .month-header {
            display: grid;
            grid-template-columns: 44px 1fr 44px;
            align-items: center;
            gap: 12px;
        }

        .month-header h2 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 600;
            text-align: center;
        }

        .month-arrow {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            padding: 0;
            border: none;
            border-radius: 50%;
            background-color: var(--surface);
            box-shadow: 0 2px 8px rgba(31, 35, 40, 0.06);
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .month-arrow:hover {
            background-color: #F1EEEB;
        }

        .month-weekdays,
        .month-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
        }

        .month-weekdays {
            margin-top: 18px;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 500;
            text-align: center;
        }

        .month-grid {
            margin-top: 8px;
        }

        .month-day {
            position: relative;
            display: grid;
            place-items: center;
            height: 46px;
            padding: 0 0 6px;
            border: 1px solid transparent;
            border-radius: 14px;
            background: none;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .month-day:hover {
            background-color: #F1EEEB;
        }

        .month-day.is-outside {
            color: #A3A9B1;
            font-weight: 500;
        }

        .month-day[aria-current="date"] {
            border-color: var(--accent);
        }

        .month-day[aria-pressed="true"] {
            border-color: var(--accent);
            background-color: var(--accent);
            color: white;
        }

        .month-day .day-dot {
            bottom: 7px;
        }

        .month-day[aria-pressed="true"] .day-dot {
            background-color: white;
        }

        .month-status {
            min-height: 1.2em;
            margin: 10px 0 0;
            color: #8A2E12;
            font-size: 0.88rem;
            font-weight: 600;
            text-align: center;
        }

        .month-footer {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 8px;
        }

        .month-footer button {
            padding: 10px 18px;
            border: 1px solid #D0D8E2;
            border-radius: 16px;
            background-color: var(--surface);
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .month-footer button:hover {
            background-color: #F1EEEB;
        }

        .month-toggle:focus-visible,
        .month-arrow:focus-visible,
        .month-day:focus-visible,
        .month-footer button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        @media (max-width: 639px) {
            .month-picker,
            .confirm-dialog {
                width: 100%;
                margin: auto 0 0;
                border-radius: 26px 26px 0 0;
            }
        }

        .week-days {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
            margin-top: 22px;
        }

        .day-button {
            display: flex;
            position: relative;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 0;
            height: 81px;
            padding: 6px 2px 10px;
            border: 1px solid #D0D8E2;
            border-radius: 22px;
            background-color: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .day-button:hover {
            background-color: #F1EEEB;
        }

        .day-button[aria-pressed="true"] {
            border-color: var(--accent);
            background-color: var(--accent);
            color: white;
        }

        .day-name {
            font-size: 0.62rem;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
        }

        .day-number {
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1;
        }

        .day-dot {
            position: absolute;
            bottom: 9px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--accent);
        }

        .day-button[aria-pressed="true"] .day-dot {
            background-color: white;
        }

        .selected-day {
            margin-top: 31px;
        }

        .selected-date {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .selected-heading-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .selected-heading-row h2 {
            margin: 0;
            font-size: clamp(1.7rem, 6vw, 2rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        .add-btn {
            display: grid;
            place-items: center;
            width: 50px;
            height: 50px;
            flex: 0 0 50px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 50%;
            background-color: var(--accent);
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .add-btn:hover {
            background-color: var(--accent-hover);
        }

        .page-error {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 16px;
            margin-top: 20px;
            padding: 12px 18px;
            border: 1px solid #F1B9A5;
            border-radius: 18px;
            background-color: #FDEEE8;
            color: #8A2E12;
            font-weight: 600;
        }

        .page-error p {
            margin: 0;
        }

        .page-error button {
            padding: 0;
            border: 0;
            background: none;
            color: var(--accent);
            font-weight: 700;
            cursor: pointer;
        }

        .page-error button:hover {
            color: var(--accent-hover);
        }

        .page-error button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .meal-list {
            display: grid;
            gap: 12px;
            margin: 28px 0 0;
            padding: 0;
            list-style: none;
        }

        .meal-card {
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 16px 60px 16px 20px;
            border: 1px solid #D0D8E2;
            border-radius: 22px;
            background-color: var(--surface);
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .meal-card:hover {
            border-color: var(--accent);
            background-color: #FFFAF7;
        }

        .meal-link {
            display: flex;
            flex-direction: column;
            gap: 4px;
            color: inherit;
            text-decoration: none;
        }

        /* Stretches the link over the whole card so any click opens the recipe.
           Anything else inside the card (like .meal-remove) must be a sibling of
           .meal-link with z-index: 1 so it sits above this layer and doesn't
           trigger the link. */
        .meal-link::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
        }

        .meal-link:focus-visible {
            outline: none;
        }

        .meal-link:focus-visible::after {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .meal-slot {
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .meal-title {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .meal-remove {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1;
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .meal-remove:hover {
            background-color: var(--accent-soft);
            color: var(--accent);
        }

        .meal-remove:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .meal-remove:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .meal-remove .icon {
            width: 18px;
            height: 18px;
        }

        /* "+ Add lunch" etc. for each empty slot */
        .meal-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 100%;
            padding: 16px 20px;
            border: 1px dashed #D0D8E2;
            border-radius: 22px;
            background: none;
            color: var(--text-muted);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }

        .meal-placeholder:hover {
            border-color: var(--accent);
            background-color: rgba(212, 85, 42, 0.04);
            color: var(--accent);
        }

        .meal-placeholder:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .meal-placeholder .icon {
            width: 18px;
            height: 18px;
        }

        .selected-day[data-state="loading"] .meal-list,
        .selected-day[data-state="loading"] .empty-state,
        .selected-day[data-state="empty"] .meal-list,
        .selected-day[data-state="error"] .meal-list,
        .selected-day[data-state="error"] .empty-state,
        .selected-day[data-state="filled"] .empty-state {
            display: none;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 183px;
            margin-top: 28px;
            border: 1px dashed #D0D8E2;
            border-radius: 24px;
            text-align: center;
        }

        .empty-state p {
            margin: 0 0 8px;
            font-size: 1rem;
            font-weight: 600;
        }

        .find-recipe {
            padding: 0;
            border: 0;
            background: none;
            color: var(--accent);
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        .find-recipe:hover {
            color: var(--accent-hover);
        }

        .nav {
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
            background-color: var(--nav-bg);
        }

        .nav-brand {
            display: none;
        }

        .nav ul {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            max-width: 620px;
            margin: 0 auto;
            padding: 10px 6px;
            list-style: none;
            border-radius: 26px;
            background-color: var(--surface);
            box-shadow: 0 4px 18px rgba(31, 35, 40, 0.06);
        }

        .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 2px 0;
            border-radius: 14px;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: var(--text);
        }

        .nav-icon {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            transition: background-color 0.2s ease;
        }

        .nav-link[aria-current="page"] {
            color: var(--accent);
        }

        .nav-link[aria-current="page"] .nav-icon {
            background-color: var(--accent-soft);
        }

        @media (min-width: 640px) {
            .content {
                padding: 28px 32px 40px;
            }

            .week-days {
                gap: 8px;
                margin-top: 26px;
            }

            .day-button {
                height: 86px;
            }

            .day-name {
                font-size: 0.72rem;
            }

            .selected-day {
                margin-top: 38px;
            }

            .empty-state {
                min-height: 210px;
            }
        }

        @media (min-width: 1024px) {
            .app {
                grid-template-columns: 240px minmax(0, 1fr);
                grid-template-rows: 90px minmax(0, 1fr);
            }

            .page-header,
            .content {
                grid-column: 2;
            }

            .page-header {
                grid-row: 1;
            }

            .content {
                grid-row: 2;
                padding: 32px 40px 48px;
            }

            .nav {
                grid-column: 1;
                grid-row: 1 / 3;
                display: flex;
                flex-direction: column;
                gap: 28px;
                padding: 30px 16px;
            }

            .nav-brand {
                display: block;
                margin: 0;
                padding: 0 12px;
                font-size: 1.4rem;
                font-weight: 700;
                letter-spacing: -0.01em;
            }

            .nav-brand span {
                color: var(--accent);
            }

            .nav ul {
                display: flex;
                flex-direction: column;
                gap: 4px;
                max-width: none;
                margin: 0;
                padding: 0;
                background: none;
                box-shadow: none;
            }

            .nav .nav-home {
                order: -1;
            }

            .nav-link {
                flex-direction: row;
                gap: 12px;
                padding: 4px 8px;
                font-size: 0.97rem;
                font-weight: 500;
                transition: color 0.2s ease, background-color 0.2s ease;
            }

            .nav-link:hover {
                background-color: rgba(31, 35, 40, 0.05);
            }

            .nav-link[aria-current="page"] {
                background-color: var(--surface);
                box-shadow: 0 4px 14px rgba(31, 35, 40, 0.06);
            }

            .selected-day {
                margin-top: 42px;
            }

            /* Wide layout: Breakfast / Lunch / Dinner side by side, with an
               "Add …" placeholder in any empty slot */
            .meal-list {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 16px;
            }

            .selected-day[data-state="empty"] .meal-list {
                display: grid;
            }

            .selected-day[data-state="empty"] .empty-state {
                display: none;
            }

            .meal-card {
                min-height: 140px;
                padding: 20px 60px 20px 22px;
            }

            .meal-placeholder {
                min-height: 140px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

    <div class="app">

    <dialog class="confirm-dialog" id="confirm-remove" aria-labelledby="confirm-remove-title" aria-describedby="confirm-remove-text">
        <form method="dialog">
            <div class="confirm-icon" aria-hidden="true">
                <svg class="icon"><use href="#icon-x"/></svg>
            </div>
            <h2 id="confirm-remove-title">Remove this meal?</h2>
            <p id="confirm-remove-text"></p>
            <div class="confirm-actions">
                <button type="submit" value="cancel" autofocus>Cancel</button>
                <button type="submit" value="remove" class="confirm-danger">Remove</button>
            </div>

    </dialog>

    <dialog class="month-picker" id="month-picker" aria-labelledby="month-title">
        <div class="month-picker-body">
            <div class="month-header">
                <button type="button" class="month-arrow" id="previous-month" aria-label="Previous month">
                    <svg class="icon"><use href="#icon-chevron-left"/></svg>
                </button>
                <h2 id="month-title" aria-live="polite"></h2>
                <button type="button" class="month-arrow" id="next-month" aria-label="Next month">
                    <svg class="icon"><use href="#icon-chevron-right"/></svg>
                </button>
            </div>
            <div class="month-weekdays" aria-hidden="true">
                <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="month-grid" id="month-grid"></div>
            <p class="month-status" id="month-status" role="status"></p>
            <div class="month-footer">
                <button type="button" id="month-today">Today</button>
                <button type="button" id="close-month">Close</button>
            </div>
        </div>
    </dialog>

    <script>
        // No login yet, so every request uses the same user (seeded in stage 3)
        const USER_ID = 1;
        const MEAL_SLOTS = { 1: "Breakfast", 2: "Lunch", 3: "Dinner" };

        // Links out to teammates' pages. Change the URLs here if theirs change.
        // Search adds the recipe, then redirects back to calendar.html?date=YYYY-MM-DD
        function searchUrl(date, slot) {
            const params = new URLSearchParams({ date });
            if (slot) params.set("slot", slot);
            return `search.html?${params}`;
        }

        function recipeUrl(recipeId) {
            return `recipe.html?id=${encodeURIComponent(recipeId)}`;
        }

        const weekDays = document.getElementById("week-days");
        const weekRange = document.getElementById("week-range");
        const weekRelative = document.getElementById("week-relative");
        const selectedDateLabel = document.getElementById("selected-date");
        const selectedDaySection = document.getElementById("selected-day");
        const mealList = document.getElementById("meal-list");
        const addMealLink = document.getElementById("add-meal");
        const findRecipeLink = document.getElementById("find-recipe");
        const pageError = document.getElementById("page-error");
        const pageErrorMessage = document.getElementById("page-error-message");
        const pageErrorRetry = document.getElementById("page-error-retry");
        const dateFormatter = new Intl.DateTimeFormat("en-US", { month: "long", day: "numeric" });

        // "YYYY-MM-DD" -> local Date, or null if it isn't a real day
        function parseDateKey(value) {
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || "");
            if (!match) return null;
            const [year, month, day] = match.slice(1).map(Number);
            const date = new Date(year, month - 1, day);
            const isRealDay = date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
            return isRealDay ? date : null;
        }

        // calendar.html?date=YYYY-MM-DD opens on that day (search redirects here after saving)
        const selectedDate = parseDateKey(new URLSearchParams(location.search).get("date")) || new Date();

        // Meals for the visible week, keyed by "YYYY-MM-DD"
        let weekMeals = new Map();
        let loadedWeekStart = null;
        let weekStatus = "loading"; // "loading" | "ready" | "error"
        let latestRequest = 0;

        function getLocalDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function getWeekBounds(date) {
            const sunday = new Date(date);
            sunday.setDate(sunday.getDate() - sunday.getDay());
            const saturday = new Date(sunday);
            saturday.setDate(saturday.getDate() + 6);
            return { sunday, saturday };
        }

        function showError(message, { retry = false } = {}) {
            pageErrorMessage.textContent = message;
            pageErrorRetry.hidden = !retry;
            pageError.hidden = false;
        }

        function clearError() {
            pageError.hidden = true;
        }

        // Loads the visible week with one request, unless it's already loaded
        async function loadWeek() {
            const { sunday, saturday } = getWeekBounds(selectedDate);
            const start = getLocalDateKey(sunday);
            if (start === loadedWeekStart) return;

            loadedWeekStart = start;
            weekMeals = new Map();
            weekStatus = "loading";
            renderCalendar();

            // Ignore responses for a week the user has already moved past
            const requestId = ++latestRequest;
            const params = new URLSearchParams({ start, end: getLocalDateKey(saturday) });
            try {
                const response = await fetch(`/api/users/${USER_ID}/calendar?${params}`);
                if (!response.ok) throw new Error(await response.text());
                const rows = await response.json();
                if (requestId !== latestRequest) return;

                for (const row of rows) {
                    if (!weekMeals.has(row.date)) weekMeals.set(row.date, []);
                    weekMeals.get(row.date).push(row);
                }
                weekStatus = "ready";
                clearError();
            } catch (error) {
                if (requestId !== latestRequest) return;
                console.error("Error loading meal plan:", error);
                weekStatus = "error";
                // Let Try again, the next day click, or a week change load it again
                loadedWeekStart = null;
                showError("Couldn't load your meal plan.", { retry: true });
            }
            renderCalendar();
        }

        const confirmRemoveDialog = document.getElementById("confirm-remove");
        const confirmRemoveText = document.getElementById("confirm-remove-text");

        // Opens the on-page confirmation. Resolves true only if Remove was clicked;
        // Cancel, Esc, and clicking the backdrop all resolve false.
        function askToRemove(meal) {
            const slotName = (MEAL_SLOTS[meal.meal_slot] || `meal ${meal.meal_slot}`).toLowerCase();
            const day = new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric" })
                .format(parseDateKey(meal.date));
            const title = document.createElement("strong");
            title.textContent = meal.recipe_title;
            confirmRemoveText.replaceChildren(title, ` will be removed from ${slotName} on ${day}.`);

            confirmRemoveDialog.returnValue = "";
            confirmRemoveDialog.showModal();
            return new Promise((resolve) => {
                confirmRemoveDialog.addEventListener("close", () => {
                    resolve(confirmRemoveDialog.returnValue === "remove");
                }, { once: true });
            });
        }

        confirmRemoveDialog.addEventListener("click", (event) => {
            if (event.target === confirmRemoveDialog) confirmRemoveDialog.close("cancel");
        });

        async function removeMeal(meal, button) {
            if (!(await askToRemove(meal))) return;

            button.disabled = true;
            try {
                const response = await fetch(`/api/users/${USER_ID}/calendar/${meal.date}/${meal.meal_slot}`, {
                    method: "DELETE"
                });
                // 404 means it's already gone, which is what we wanted anyway
                if (!response.ok && response.status !== 404) throw new Error(await response.text());
            } catch (error) {
                console.error("Error removing meal:", error);
                showError(`Couldn't remove ${meal.recipe_title}. Please try again.`);
                button.disabled = false;
                return;
            }

            const remaining = (weekMeals.get(meal.date) || []).filter((m) => m.meal_slot !== meal.meal_slot);
            if (remaining.length > 0) {
                weekMeals.set(meal.date, remaining);
            } else {
                weekMeals.delete(meal.date);
            }
            clearError();
            renderCalendar();
            // The card that had focus is gone, so keep keyboard users nearby
            addMealLink.focus();
        }

        function createMealCard(meal) {
            const item = document.createElement("li");
            item.className = "meal-card";
            const link = document.createElement("a");
            link.className = "meal-link";
            link.href = recipeUrl(meal.recipe_id);
            const slot = document.createElement("span");
            slot.className = "meal-slot";
            slot.textContent = MEAL_SLOTS[meal.meal_slot] || `Meal ${meal.meal_slot}`;
            const title = document.createElement("span");
            title.className = "meal-title";
            title.textContent = meal.recipe_title;
            link.append(slot, title);

            // A sibling of the link (not inside it), so clicking it never opens the recipe
            const remove = document.createElement("button");
            remove.type = "button";
            remove.className = "meal-remove";
            remove.setAttribute("aria-label", `Remove ${meal.recipe_title} from ${slot.textContent.toLowerCase()}`);
            remove.innerHTML = '<svg class="icon"><use href="#icon-x"/></svg>';
            remove.addEventListener("click", () => removeMeal(meal, remove));

            item.append(link, remove);
            return item;
        }

        // "+ Add lunch" etc. for an empty slot
        function createMealPlaceholder(dateKey, slotNumber, slotName) {
            const item = document.createElement("li");
            const link = document.createElement("a");
            link.className = "meal-placeholder";
            link.href = searchUrl(dateKey, slotNumber);
            link.innerHTML = '<svg class="icon"><use href="#icon-plus"/></svg>';
            link.append(`Add ${slotName.toLowerCase()}`);
            item.append(link);
            return item;
        }

        function renderSelectedDay() {
            const dateKey = getLocalDateKey(selectedDate);
            const meals = weekMeals.get(dateKey) || [];
            mealList.replaceChildren();

            // One entry per slot in meal order, then any slot numbers we don't have a name for
            let firstEmptySlot = null;
            for (const [slotNumber, slotName] of Object.entries(MEAL_SLOTS)) {
                const meal = meals.find((m) => m.meal_slot === Number(slotNumber));
                if (!meal && firstEmptySlot === null) firstEmptySlot = Number(slotNumber);
                mealList.append(meal ? createMealCard(meal) : createMealPlaceholder(dateKey, slotNumber, slotName));
            }
            for (const meal of meals.filter((m) => !MEAL_SLOTS[m.meal_slot])) {
                mealList.append(createMealCard(meal));
            }

            // + goes to the first empty slot, or just the day if every slot is full
            addMealLink.href = searchUrl(dateKey, firstEmptySlot);
            addMealLink.setAttribute("aria-label", firstEmptySlot
                ? `Add ${MEAL_SLOTS[firstEmptySlot].toLowerCase()}`
                : "Add a meal");
            findRecipeLink.href = searchUrl(dateKey, firstEmptySlot);

            selectedDaySection.dataset.state = weekStatus === "ready"
                ? (meals.length > 0 ? "filled" : "empty")
                : weekStatus;
        }

        function renderCalendar() {
            const { sunday, saturday } = getWeekBounds(selectedDate);

            const sameMonth = sunday.getMonth() === saturday.getMonth();
            weekRange.textContent = sameMonth
                ? `${new Intl.DateTimeFormat("en-US", { month: "long" }).format(sunday)} ${sunday.getDate()}–${saturday.getDate()}`
                : `${dateFormatter.format(sunday)}–${dateFormatter.format(saturday)}`;
            const today = new Date();
            const currentSunday = new Date(today);
            currentSunday.setDate(currentSunday.getDate() - currentSunday.getDay());
            currentSunday.setHours(0, 0, 0, 0);
            const weekOffset = Math.round((sunday - currentSunday) / (7 * 24 * 60 * 60 * 1000));
            weekRelative.textContent = weekOffset === 0
                ? "This week"
                : weekOffset === 1
                    ? "Next week"
                    : weekOffset === -1
                        ? "Last week"
                        : `Week of ${dateFormatter.format(sunday)}`;

            weekDays.replaceChildren();
            for (let index = 0; index < 7; index += 1) {
                const date = new Date(sunday);
                date.setDate(sunday.getDate() + index);
                const button = document.createElement("button");
                button.type = "button";
                button.className = "day-button";
                button.setAttribute("aria-pressed", getLocalDateKey(date) === getLocalDateKey(selectedDate) ? "true" : "false");
                const hasMeals = weekMeals.has(getLocalDateKey(date));
                const dayLabel = new Intl.DateTimeFormat("en-US", {
                    weekday: "long",
                    month: "long",
                    day: "numeric"
                }).format(date);
                button.setAttribute("aria-label", hasMeals ? `${dayLabel}, meals planned` : dayLabel);

                const dayName = document.createElement("span");
                dayName.className = "day-name";
                dayName.textContent = new Intl.DateTimeFormat("en-US", { weekday: "short" }).format(date);
                const dayNumber = document.createElement("span");
                dayNumber.className = "day-number";
                dayNumber.textContent = String(date.getDate());
                button.append(dayName, dayNumber);
                if (hasMeals) {
                    const dot = document.createElement("span");
                    dot.className = "day-dot";
                    button.append(dot);
                }
                button.addEventListener("click", () => {
                    selectedDate.setTime(date.getTime());
                    showSelectedDate();
                });
                weekDays.append(button);
            }

            selectedDateLabel.textContent = new Intl.DateTimeFormat("en-US", {
                weekday: "short",
                month: "long",
                day: "numeric"
            }).format(selectedDate).toUpperCase();

            renderSelectedDay();
        }

        // Re-renders right away, then fetches only if the week changed
        // (or the last load for this week failed)
        function showSelectedDate() {
            renderCalendar();
            loadWeek();
        }

        document.getElementById("previous-week").addEventListener("click", () => {
            selectedDate.setDate(selectedDate.getDate() - 7);
            showSelectedDate();
        });
        document.getElementById("next-week").addEventListener("click", () => {
            selectedDate.setDate(selectedDate.getDate() + 7);
            showSelectedDate();
        });
        pageErrorRetry.addEventListener("click", showSelectedDate);

        // ---------- Month view popup ----------
        const monthPicker = document.getElementById("month-picker");
        const monthTitle = document.getElementById("month-title");
        const monthGrid = document.getElementById("month-grid");
        const monthStatus = document.getElementById("month-status");
        const monthTitleFormatter = new Intl.DateTimeFormat("en-US", { month: "long", year: "numeric" });
        const monthDayLabelFormatter = new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });

        // monthFocus is the day keyboard focus is on; the grid shows its month
        let monthFocus = new Date();
        let monthMealDates = new Set();
        let loadedMonthStart = null;
        let latestMonthRequest = 0;

        // Always 6 weeks (Sunday before the 1st onward) so the popup doesn't change height
        function getMonthGridBounds(date) {
            const start = new Date(date.getFullYear(), date.getMonth(), 1);
            start.setDate(start.getDate() - start.getDay());
            const end = new Date(start);
            end.setDate(end.getDate() + 41);
            return { start, end };
        }

        // Which days in the grid have meals, with one request per month
        async function loadMonth() {
            const { start, end } = getMonthGridBounds(monthFocus);
            const startKey = getLocalDateKey(start);
            if (startKey === loadedMonthStart) return;

            loadedMonthStart = startKey;
            monthMealDates = new Set();
            monthStatus.textContent = "";
            renderMonth();

            const requestId = ++latestMonthRequest;
            const params = new URLSearchParams({ start: startKey, end: getLocalDateKey(end) });
            try {
                const response = await fetch(`/api/users/${USER_ID}/calendar?${params}`);
                if (!response.ok) throw new Error(await response.text());
                const rows = await response.json();
                if (requestId !== latestMonthRequest) return;
                monthMealDates = new Set(rows.map((row) => row.date));
            } catch (error) {
                if (requestId !== latestMonthRequest) return;
                console.error("Error loading month:", error);
                loadedMonthStart = null;
                monthStatus.textContent = "Couldn't load which days have meals.";
            }
            renderMonth();
        }

        function renderMonth({ focus = false } = {}) {
            const viewMonth = monthFocus.getMonth();
            monthTitle.textContent = monthTitleFormatter.format(monthFocus);

            const { start } = getMonthGridBounds(monthFocus);
            const todayKey = getLocalDateKey(new Date());
            const selectedKey = getLocalDateKey(selectedDate);
            const focusKey = getLocalDateKey(monthFocus);
            let focusButton = null;

            monthGrid.replaceChildren();
            for (let index = 0; index < 42; index += 1) {
                const date = new Date(start);
                date.setDate(start.getDate() + index);
                const key = getLocalDateKey(date);
                const hasMeals = monthMealDates.has(key);

                const button = document.createElement("button");
                button.type = "button";
                button.className = date.getMonth() === viewMonth ? "month-day" : "month-day is-outside";
                button.textContent = String(date.getDate());
                button.dataset.date = key;
                // Only the focused day is tabbable; arrow keys move between days
                button.tabIndex = key === focusKey ? 0 : -1;
                button.setAttribute("aria-pressed", key === selectedKey ? "true" : "false");
                if (key === todayKey) button.setAttribute("aria-current", "date");
                const label = monthDayLabelFormatter.format(date);
                button.setAttribute("aria-label", hasMeals ? `${label}, meals planned` : label);
                if (hasMeals) {
                    const dot = document.createElement("span");
                    dot.className = "day-dot";
                    button.append(dot);
                }
                if (key === focusKey) focusButton = button;
                monthGrid.append(button);
            }
            if (focus && focusButton) focusButton.focus();
        }

        function openMonthPicker() {
            monthFocus = new Date(selectedDate);
            // Meals may have changed since last time (removed here, added on search)
            loadedMonthStart = null;
            monthPicker.showModal();
            renderMonth({ focus: true });
            loadMonth();
        }

        // Jump the page to a day and its week
        function pickDate(date) {
            selectedDate.setTime(date.getTime());
            monthPicker.close();
            showSelectedDate();
        }

        // Moves by whole months, keeping the day number where possible (Jan 31 -> Feb 28)
        function changeMonth(offset, options) {
            const day = monthFocus.getDate();
            const target = new Date(monthFocus.getFullYear(), monthFocus.getMonth() + offset, 1);
            const daysInMonth = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
            target.setDate(Math.min(day, daysInMonth));
            monthFocus = target;
            renderMonth(options);
            loadMonth();
        }

        function moveFocusByDays(days) {
            monthFocus.setDate(monthFocus.getDate() + days);
            renderMonth({ focus: true });
            loadMonth();
        }

        monthGrid.addEventListener("click", (event) => {
            const button = event.target.closest(".month-day");
            if (button) pickDate(parseDateKey(button.dataset.date));
        });

        monthGrid.addEventListener("keydown", (event) => {
            const moves = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 };
            if (event.key in moves) {
                moveFocusByDays(moves[event.key]);
            } else if (event.key === "PageUp" || event.key === "PageDown") {
                changeMonth(event.key === "PageUp" ? -1 : 1, { focus: true });
            } else {
                return;
            }
            event.preventDefault();
        });

        document.getElementById("open-month").addEventListener("click", openMonthPicker);
        document.getElementById("previous-month").addEventListener("click", () => changeMonth(-1));
        document.getElementById("next-month").addEventListener("click", () => changeMonth(1));
        // Shows the current month (popup stays open) with focus on today
        document.getElementById("month-today").addEventListener("click", () => {
            monthFocus = new Date();
            renderMonth({ focus: true });
            loadMonth();
        });
        document.getElementById("close-month").addEventListener("click", () => monthPicker.close());
        // Clicking the dimmed backdrop closes it, like the popups on the home page
        monthPicker.addEventListener("click", (event) => {
            if (event.target === monthPicker) monthPicker.close();
        });

        showSelectedDate();
    </script>
</body>
</html>
